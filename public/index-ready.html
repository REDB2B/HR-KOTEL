:root {
  --pantone-lime: #97d700;
  --pantone-forest: #154734;
  --pantone-pink: #f7ced7;
  --witch-purple: #8b5cf6;
  --witch-purple-deep: #2e1065;
  --bg-dark: #0b0813;
  --bg-surface: #141022;
  --bg-surface-elevated: #1d1730;
  --text-primary: #fff;
  --text-secondary: #e5e0f5;
  --text-muted: #a39ab8;
}

html {
  scroll-behavior: smooth;
  background-color: var(--bg-dark);
  color: var(--text-primary);
}

body {
  background-color: var(--bg-dark);
  color: var(--text-primary);
  font-family: Plus Jakarta Sans, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
  overflow-x: hidden;
}

button, a, input, select, textarea, button:hover {
  transition: all .25s cubic-bezier(.16, 1, .3, 1);
}

button:active {
  transform: scale(.975);
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #0b0813;
}

::-webkit-scrollbar-thumb {
  background: #2e1065;
  border: 1px solid #97d70033;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #4c1d95;
}

@keyframes cauldron-steam {
  0% {
    opacity: .2;
    transform: translateY(0) scale(.9) rotate(0);
  }

  50% {
    opacity: .75;
    transform: translateY(-24px) scale(1.15) rotate(6deg);
  }

  100% {
    opacity: 0;
    transform: translateY(-48px) scale(1.3) rotate(-6deg);
  }
}

@keyframes bubble-float {
  0% {
    opacity: 0;
    transform: translateY(0) scale(.5);
  }

  30% {
    opacity: 1;
  }

  90% {
    opacity: .9;
    transform: translateY(-45px) scale(1.1);
  }

  100% {
    opacity: 0;
    transform: translateY(-60px) scale(0);
  }
}

@keyframes stir-wand {
  0% {
    transform: rotate(18deg) translate(0);
  }

  50% {
    transform: rotate(8deg) translate(8px, -4px);
  }

  100% {
    transform: rotate(18deg) translate(0);
  }
}

@keyframes potion-glow {
  0%, 100% {
    filter: drop-shadow(0 0 16px #97d70080) drop-shadow(0 0 32px #8b5cf64d);
  }

  50% {
    filter: drop-shadow(0 0 28px #97d700cc) drop-shadow(0 0 44px #8b5cf680);
  }
}

@keyframes float-badge {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

.animate-steam-1 {
  animation: 3.2s ease-in-out infinite cauldron-steam;
}

.animate-steam-2 {
  animation: 3.8s ease-in-out 1.2s infinite cauldron-steam;
}

.animate-steam-3 {
  animation: 4.2s ease-in-out 2s infinite cauldron-steam;
}

.animate-bubble-1 {
  animation: 2.4s ease-in-out infinite bubble-float;
}

.animate-bubble-2 {
  animation: 2.8s ease-in-out .8s infinite bubble-float;
}

.animate-bubble-3 {
  animation: 3.2s ease-in-out 1.5s infinite bubble-float;
}

.animate-stir {
  transform-origin: 100% 0;
  animation: 4s ease-in-out infinite stir-wand;
}

.animate-potion-glow {
  animation: 3s ease-in-out infinite potion-glow;
}

.animate-float-slow {
  animation: 4s ease-in-out infinite float-badge;
}

.animate-float-delayed {
  animation: 4.5s ease-in-out 1.5s infinite float-badge;
}
